name: CI

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      db:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: foldy
          POSTGRES_PASSWORD: foldy
          POSTGRES_DB: foldy
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U foldy" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://foldy:foldy@localhost:5432/foldy
      BETTER_AUTH_SECRET: ci-only-secret-not-used-anywhere-else-0123456789
      BETTER_AUTH_URL: http://localhost:3100
      UPLOAD_DIR: ./uploads
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run db:migrate
      - run: npm run db:seed
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: playwright-report
          path: test-results
          retention-days: 7
